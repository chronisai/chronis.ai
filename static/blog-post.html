<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Chronis Journal</title>
<meta name="description" content="Dispatches on self-quantification, memory science, pattern intelligence, and the frontier of human understanding. From the team building Chronis.">
<link rel="canonical" href="https://chronis.in/blog/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050505;--bg2:#0b0b0b;--bg3:#111111;
  --sf:rgba(255,255,255,.024);--sf2:rgba(255,255,255,.044);
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.14);
  --tx:#ece8e2;--mu:rgba(236,232,226,.38);--mu2:rgba(236,232,226,.62);--ch:rgba(236,232,226,.84);
  --ne:#7c3aed;--ne2:#a78bfa;--ne3:#c4b5fd;
  --fd:'Cormorant Garamond',Georgia,serif;
  --fb:'Plus Jakarta Sans',system-ui,sans-serif;
}
html{scroll-behavior:smooth}
body{padding-top:64px;background:var(--bg);color:var(--tx);font-family:var(--fb);font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}

#bgc{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45}
main,footer,nav{position:relative;z-index:1}

nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:rgba(5,5,5,.88);backdrop-filter:blur(28px);border-bottom:1px solid var(--bd)}
.nl{font-family:var(--fd);font-size:20px;font-weight:400;letter-spacing:4px;text-transform:uppercase;color:var(--ch);text-decoration:none}
.nr{display:flex;gap:6px;align-items:center}
.na{color:var(--mu);text-decoration:none;font-size:13px;padding:6px 13px;border-radius:6px;transition:.2s}
.na:hover{color:var(--tx);background:var(--sf)}
.nc{background:var(--tx);color:#000;font-size:13px;font-weight:600;padding:8px 18px;border-radius:8px;text-decoration:none;transition:.2s}
.nc:hover{opacity:.87}
@media(max-width:768px){.na{display:none}.nr .nc{display:flex}}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* ── ARTICLE HEADER ── */
.art-header{max-width:760px;margin:0 auto;padding:64px 24px 40px;text-align:center}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:1px;color:var(--mu);text-decoration:none;margin-bottom:32px;transition:.2s}
.back-link:hover{color:var(--ch)}
.art-tag-lg{display:inline-block;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-weight:600;color:var(--ne3);background:rgba(124,58,237,.08);border:1px solid rgba(167,139,250,.28);border-radius:999px;padding:7px 16px;margin-bottom:24px}
.art-h1{font-family:var(--fd);font-size:clamp(34px,6vw,58px);font-weight:300;line-height:1.08;letter-spacing:-1px;margin-bottom:20px;animation:fadeUp .9s ease both}
.art-excerpt{font-size:17px;line-height:1.7;color:var(--mu2);font-weight:300;max-width:620px;margin:0 auto 32px}
.art-byline{display:flex;align-items:center;justify-content:center;gap:14px;font-size:13px;color:var(--mu)}
.art-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--ne),var(--ne2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;overflow:hidden}
.art-avatar img{width:100%;height:100%;object-fit:cover}
.art-byline-name{color:var(--ch);font-weight:500}
.art-byline-dot{opacity:.4}

/* ── COVER IMAGE ── */
.art-cover{max-width:1040px;margin:0 auto 56px;padding:0 24px}
.art-cover img{width:100%;border-radius:20px;border:1px solid var(--bd);display:block}

/* ── BODY ── */
.art-body{max-width:680px;margin:0 auto;padding:0 24px 100px;font-size:17px;line-height:1.85;color:var(--mu2);font-weight:300}
.art-body h1,.art-body h2,.art-body h3{font-family:var(--fd);color:var(--ch);font-weight:400;line-height:1.2;margin:44px 0 18px}
.art-body h2{font-size:30px;letter-spacing:-.3px}
.art-body h3{font-size:23px}
.art-body p{margin-bottom:22px}
.art-body a{color:var(--ne3);text-decoration:underline;text-decoration-color:rgba(167,139,250,.3);text-underline-offset:3px}
.art-body a:hover{text-decoration-color:var(--ne3)}
.art-body strong{color:var(--ch);font-weight:600}
.art-body em{font-style:italic;color:var(--ch)}
.art-body blockquote{border-left:2px solid var(--ne2);padding:4px 0 4px 24px;margin:32px 0;font-family:var(--fd);font-size:21px;font-style:italic;color:var(--ch);font-weight:300;line-height:1.5}
.art-body code{background:var(--sf2);border:1px solid var(--bd);border-radius:5px;padding:2px 7px;font-size:.87em;font-family:ui-monospace,monospace;color:var(--ne3)}
.art-body ul{margin:0 0 22px 22px}
.art-body li{margin-bottom:9px}
.art-body img{max-width:100%;border-radius:14px;border:1px solid var(--bd);margin:12px 0;display:block}
.art-body figure{margin:36px 0}
.art-body figcaption{font-size:13px;color:var(--mu);text-align:center;margin-top:10px;font-style:italic}

/* ── SHARE / META STRIP ── */
.art-strip{display:flex;justify-content:space-between;align-items:center;max-width:680px;margin:0 auto 48px;padding:0 24px 24px;border-bottom:1px solid var(--bd)}
.art-strip-meta{font-size:12px;color:var(--mu);letter-spacing:.5px}
.share-btns{display:flex;gap:8px}
.share-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--sf);color:var(--mu2);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:13px;transition:.2s;cursor:pointer}
.share-btn:hover{border-color:var(--bd2);color:var(--ch)}

/* ── RELATED ── */
.related-sec{max-width:1120px;margin:0 auto;padding:0 24px 100px}
.related-label{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--mu);font-weight:500;margin-bottom:24px;display:block}
.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rel-card{background:linear-gradient(180deg,rgba(255,255,255,.024),rgba(255,255,255,.01));border:1px solid var(--bd);border-radius:16px;padding:22px;text-decoration:none;display:flex;flex-direction:column;transition:.25s}
.rel-card:hover{border-color:var(--bd2);transform:translateY(-2px)}
.rel-tag{display:inline-block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ne3);margin-bottom:10px}
.rel-card h3{font-family:var(--fd);font-size:19px;font-weight:400;line-height:1.28;color:var(--ch);margin-bottom:8px}
.rel-meta{font-size:11px;color:var(--mu);margin-top:auto}
@media(max-width:768px){.related-grid{grid-template-columns:1fr}.art-strip{flex-direction:column;gap:14px;align-items:flex-start}}

/* ── LOADING / 404 ── */
.state-msg{max-width:600px;margin:120px auto;text-align:center;padding:0 24px}
.state-msg h2{font-family:var(--fd);font-size:32px;font-weight:300;margin-bottom:14px}
.state-msg p{color:var(--mu);font-size:15px;line-height:1.7}
.state-msg a{color:var(--ne3);text-decoration:underline;text-underline-offset:3px}

footer{max-width:1120px;margin:0 auto;padding:32px 24px 60px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd)}
.fb{font-family:var(--fd);font-size:18px;font-weight:300;letter-spacing:3px;text-transform:uppercase;color:var(--ch);text-decoration:none}
.fc{font-size:12px;color:var(--mu)}
</style>
<script src="/static/js/chronis-nav.js" defer></script>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
<link rel="manifest" href="/static/icons/site.webmanifest">
</head>
<body>

<canvas id="bgc"></canvas>
<nav id="cn-nav"></nav>

<main>
  <div id="article-root">
    <div class="state-msg"><h2>Loading article…</h2></div>
  </div>
</main>

<footer>
  <a href="/" class="fb">Chronis</a>
  <span class="fc">© 2026 Chronis Technologies Pvt. Ltd.</span>
</footer>

<script>
/* ── Star field (matches blog.html) ── */
(function(){
  const c=document.getElementById('bgc'),ctx=c.getContext('2d');
  let W,H,P=[];
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
  resize();addEventListener('resize',resize);
  for(let i=0;i<90;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*.8+.2,vx:(Math.random()-.5)*.08,vy:(Math.random()-.5)*.08,a:Math.random()*.22+.06,da:(Math.random()-.5)*.0015});
  function draw(){
    ctx.clearRect(0,0,W,H);
    P.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.a+=p.da;
      if(p.a<.04||p.a>.28)p.da*=-1;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${p.a})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  }draw();
})();

/* ── Minimal markdown -> HTML renderer (mirrors the editor's preview) ──
   Adds image support: ![alt](url) and figure/caption via ![alt](url "caption") */
function mdToHtml(md) {
  if (!md) return '';
  let h = md
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^## (.*)$/gm, '<h2>$1</h2>')
    .replace(/^# (.*)$/gm, '<h1>$1</h1>')
    .replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>')
    .replace(/!\[(.*?)\]\((https?:\/\/[^\s)]+?)(?:\s+"(.*?)")?\)/g, (m, alt, src, caption) => {
      const img = `<img src="${src}" alt="${alt.replace(/"/g,'&quot;')}" loading="lazy">`;
      return caption ? `<figure>${img}<figcaption>${caption}</figcaption></figure>` : img;
    })
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^- (.*)$/gm, '<li>$1</li>');
  h = h.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
  h = h.split(/\n{2,}/).map(block => {
    if (/^<(h1|h2|h3|ul|blockquote|figure|img)/.test(block.trim())) return block;
    return block.trim() ? `<p>${block.trim().replace(/\n/g, '<br>')}</p>` : '';
  }).join('\n');
  return h;
}

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function timeAgo(dateStr) {
  return new Date(dateStr).toLocaleDateString('en-IN', { year:'numeric', month:'long', day:'numeric' });
}

async function loadArticle() {
  const slug = location.pathname.replace(/^\/blog\//, '').replace(/\/$/, '');
  const root = document.getElementById('article-root');
  if (!slug) { renderNotFound(root); return; }

  try {
    const res = await fetch(`/api/blog/posts/${encodeURIComponent(slug)}`);
    if (!res.ok) { renderNotFound(root); return; }
    const { post, related } = await res.json();
    renderArticle(root, post, related || []);
    document.title = `${post.title} — The Chronis Journal`;
  } catch (err) {
    console.error(err);
    renderNotFound(root);
  }
}

function renderNotFound(root) {
  root.innerHTML = `
    <div class="state-msg">
      <h2>Article not found</h2>
      <p>This piece may have been moved or unpublished. <a href="/blog">Browse the Journal →</a></p>
    </div>`;
}

function renderArticle(root, post, related) {
  const initials = (post.author_name || 'C').split(' ').map(w => w[0]).slice(0,2).join('');
  root.innerHTML = `
    <div class="art-header">
      <a href="/blog" class="back-link">← The Chronis Journal</a>
      <span class="art-tag-lg">${escHtml(post.category)}</span>
      <h1 class="art-h1">${escHtml(post.title)}</h1>
      ${post.excerpt ? `<p class="art-excerpt">${escHtml(post.excerpt)}</p>` : ''}
      <div class="art-byline">
        <div class="art-avatar">${post.author_avatar ? `<img src="${post.author_avatar}">` : initials}</div>
        <span class="art-byline-name">${escHtml(post.author_name || 'Chronis Team')}</span>
        <span class="art-byline-dot">·</span>
        <span>${timeAgo(post.published_at)}</span>
        <span class="art-byline-dot">·</span>
        <span>${post.read_minutes} min read</span>
      </div>
    </div>

    ${post.cover_image_url ? `
    <div class="art-cover">
      <img src="${post.cover_image_url}" alt="${escHtml(post.title)}" loading="eager">
    </div>` : ''}

    <article class="art-body">${mdToHtml(post.body_md)}</article>

    <div class="art-strip">
      <span class="art-strip-meta">${(post.view_count || 0).toLocaleString('en-IN')} reads · Filed under ${escHtml(post.category)}</span>
      <div class="share-btns">
        <a class="share-btn" title="Share on X" target="_blank" rel="noopener"
           href="https://twitter.com/intent/tweet?text=${encodeURIComponent(post.title)}&url=${encodeURIComponent(location.href)}">𝕏</a>
        <a class="share-btn" title="Share on LinkedIn" target="_blank" rel="noopener"
           href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(location.href)}">in</a>
        <button class="share-btn" title="Copy link" onclick="copyLink(this)">🔗</button>
      </div>
    </div>

    ${related.length ? `
    <section class="related-sec">
      <span class="related-label">Continue reading</span>
      <div class="related-grid">
        ${related.map(r => `
          <a class="rel-card" href="/blog/${r.slug}">
            <span class="rel-tag">${escHtml(r.category)}</span>
            <h3>${escHtml(r.title)}</h3>
            <span class="rel-meta">${r.read_minutes} min read</span>
          </a>
        `).join('')}
      </div>
    </section>` : ''}
  `;
}

function copyLink(btn) {
  navigator.clipboard.writeText(location.href).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
}

loadArticle();
</script>
</body>
</html>
